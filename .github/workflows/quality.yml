name: Quality
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.8'
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --locked ruff check src tests scripts
      - run: uv run --locked ruff format --check src tests scripts
      - run: uv run --locked pytest --cov=handfont --cov-report=term-missing
      - run: uv build --no-sources
  audit:
    # Validates the shipped fonts/ files and runs the independent FontBakery
    # audit. Uses only committed files; no private photographs are needed.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.8'
          enable-cache: true
      - run: uv sync --locked --group audit
      - run: uv run --locked handfont validate fonts/LensaHand-Regular.ttf --manifest config/alphabet.json
      - run: uv run --locked handfont validate fonts/LensaHand-Regular.woff2 --manifest config/alphabet.json
      - run: >-
          uv run --locked --group audit fontbakery check-universal
          fonts/LensaHand-Regular.ttf --skip-network --error-code-on FAIL
          --json fontbakery-report.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: fontbakery-report
          path: fontbakery-report.json
