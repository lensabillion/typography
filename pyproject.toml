[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "lensa-hand"
version = "0.3.0"
description = "Reproducible handwriting-to-font tools and the Lensa Hand typeface"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "brotli>=1.2.0,<2",
    "fonttools>=4.66.0,<5",
    "numpy>=2.5.3,<3",
    "opencv-python-headless>=5.0.0.93,<6",
    "pillow>=12.3.0,<13",
    "potracer>=0.0.4,<0.1",
]

[project.scripts]
lensa-hand = "lensa_hand.cli:main"

[dependency-groups]
dev = ["pytest>=9.1.1,<10", "pytest-cov>=7.1.0,<8", "ruff>=0.16.9,<0.17", "uharfbuzz>=0.56.2,<0.57"]
audit = ["fontbakery>=1.1.0,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/lensa_hand"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "config/", "scripts/", "pyproject.toml", "README.md", "uv.lock", ".python-version"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"

[tool.coverage.report]
fail_under = 90

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
